security:
    providers:
        jwt:
            lexik_jwt:
                class: App\Security\TokenUser

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api/articles
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/articles/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/articles, roles: IS_AUTHENTICATED_FULLY }
